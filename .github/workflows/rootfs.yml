name: Build Ubuntu 25.10 ARM64 Rootfs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Ubuntu 发行版代号 (25.10 为 questing)'
        required: true
        default: 'questing'
      variant:
        description: '构建变体 (standard, minbase)'
        required: true
        default: 'standard'
      username:
        description: '创建的用户名'
        required: true
      password:
        description: '用户密码'
        required: true
      sudo_nopasswd:
        description: 'sudo 是否免密'
        type: boolean
        default: false
      enable_deb_src:
        description: '是否同时启用 deb-src 源码源'
        type: boolean
        default: false

jobs:
  build:
    # 使用 GitHub 原生 ARM64 Runner（若需改回 x86_64 跑 QEMU，改为 ubuntu-26.04 并装 qemu-user-static binfmt-support）
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring e2fsprogs

      - name: Build Rootfs (arm64)
        env:
          ARCH: arm64
          SUITE: ${{ github.event.inputs.suite }}
          VARIANT: ${{ github.event.inputs.variant }}
          USERNAME: ${{ github.event.inputs.username }}
          PASSWORD: ${{ github.event.inputs.password }}
          SUDO_NOPASSWD: ${{ github.event.inputs.sudo_nopasswd }}
          ENABLE_DEB_SRC: ${{ github.event.inputs.enable_deb_src }}
        run: |
          if [ "$ENABLE_DEB_SRC" = "true" ]; then
            TYPES="deb deb-src"
          else
            TYPES="deb"
          fi

          # 生成与 Ubuntu 官方 ARM64 一致的完整两段式 DEB822 源
          cat <<EOF > ubuntu.sources
          Types: ${TYPES}
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${SUITE} ${SUITE}-updates ${SUITE}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: ${TYPES}
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${SUITE}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          # 安全写入初始化脚本（通过 %q 转义密码中的 ! @ 等特殊符号）
          {
            echo '#!/bin/bash'
            echo 'set -e'
            printf 'TARGET_USER=%q\n' "$USERNAME"
            printf 'TARGET_PASS=%q\n' "$PASSWORD"
            printf 'TARGET_SUDO_NOPASSWD=%q\n' "$SUDO_NOPASSWD"
            printf 'HOST_SOURCES_FILE=%q\n' "$PWD/ubuntu.sources"
          } > init_user.sh

          cat <<'HOOK' >> init_user.sh
          ROOTFS="$1"

          # 1. 创建用户并设置密码
          chroot "$ROOTFS" useradd -m -s /bin/bash -G sudo "$TARGET_USER"
          printf '%s:%s\n' "$TARGET_USER" "$TARGET_PASS" | chroot "$ROOTFS" chpasswd

          if [ "$TARGET_SUDO_NOPASSWD" = "true" ]; then
            echo "$TARGET_USER ALL=(ALL:ALL) NOPASSWD: ALL" > "$ROOTFS/etc/sudoers.d/$TARGET_USER"
            chmod 0440 "$ROOTFS/etc/sudoers.d/$TARGET_USER"
          fi

          # 2. 清理 mmdebstrap 临时生成的文件及任何跳过签名校验的配置，替换为规范的 ubuntu.sources
          rm -f "$ROOTFS/etc/apt/apt.conf.d/99mmdebstrap" \
                "$ROOTFS/etc/apt/sources.list" \
                "$ROOTFS/etc/apt/sources.list.d/"*.list \
                "$ROOTFS/etc/apt/sources.list.d/"*.sources
          mkdir -p "$ROOTFS/etc/apt/sources.list.d"
          cp "$HOST_SOURCES_FILE" "$ROOTFS/etc/apt/sources.list.d/ubuntu.sources"
          chmod 0644 "$ROOTFS/etc/apt/sources.list.d/ubuntu.sources"

          # 3. 用正式 GPG 校验刷新全部 4 个 Suite 的索引
          chroot "$ROOTFS" apt-get update
          HOOK
          chmod +x init_user.sh

          OPTS=(
            "--arch=$ARCH"
            "--variant=$VARIANT"
            "--keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg"
            "--include=sudo,sudo-rs,ca-certificates,openssh-server"
            "--customize-hook=./init_user.sh \"\$1\""
          )

          sudo mmdebstrap "${OPTS[@]}" "$SUITE" "rootfs-${SUITE}-${ARCH}.tar.gz" ./ubuntu.sources
          sudo mmdebstrap "${OPTS[@]}" "$SUITE" "rootfs-${SUITE}-${ARCH}.ext4" ./ubuntu.sources

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ github.event.inputs.suite }}-arm64
          path: |
            rootfs-*.tar.gz
            rootfs-*.ext4
          retention-days: 7
